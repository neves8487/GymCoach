steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/gym-coach', '.']

  # Push to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/gym-coach']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gym-coach'
      - '--image=gcr.io/$PROJECT_ID/gym-coach'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--service-account=agente-pt-nutricao@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets=WHATSAPP_TOKEN=whatsapp-token:latest,WHATSAPP_PHONE_NUMBER_ID=whatsapp-phone-id:latest,WHATSAPP_VERIFY_TOKEN=whatsapp-verify-token:latest,WHATSAPP_APP_SECRET=whatsapp-app-secret:latest,TELEGRAM_TOKEN=telegram-token:latest'
      - '--set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=TRUE,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=us-central1,AGENT_ENGINE_RESOURCE_NAME=projects/582508796330/locations/us-central1/reasoningEngines/7208452657525030912,GCS_BUCKET_NAME=gymcoach-503009-fotos-refeicoes,LOG_LEVEL=INFO'

images:
  - 'gcr.io/$PROJECT_ID/gym-coach'

options:
  logging: CLOUD_LOGGING_ONLY
